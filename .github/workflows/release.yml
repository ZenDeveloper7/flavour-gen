name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [amd64]
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: flavour-gen-linux-amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            binary: flavour-gen-darwin-amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            binary: flavour-gen-windows-amd64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        run: |
          go build -o ${{ matrix.binary }} .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets
        run: |
          mkdir -p assets
          LINUX_BIN=$(find artifacts -name "flavour-gen-linux-amd64" -type f | head -1)
          DARWIN_BIN=$(find artifacts -name "flavour-gen-darwin-amd64" -type f | head -1)
          WINDOWS_BIN=$(find artifacts -name "flavour-gen-windows-amd64.exe" -type f | head -1)
          cp "$LINUX_BIN" assets/ || { echo "Linux binary not found"; exit 1; }
          cp "$DARWIN_BIN" assets/ || { echo "Darwin binary not found"; exit 1; }
          cp "$WINDOWS_BIN" assets/ || { echo "Windows binary not found"; exit 1; }
          cd assets && sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automated build release.
          draft: false
          make_latest: true
          files: |
            assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

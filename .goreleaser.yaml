# .goreleaser.yaml
version: 2

project_name: flavour-gen

before:
  hooks:
    - go mod tidy

builds:
  - id: flavour-gen
    binary: flavour-gen
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0

archives:
  - id: default
    format: tar.gz

checksum:
  name_template: 'checksums.txt'

release:
  github:
    owner: ZenDeveloper7
    name: flavour-gen

homebrew:
  - repository:
      owner: ZenDeveloper7
      name: homebrew-tap
    directory: Formula
    upload_url: https://github.com/ZenDeveloper7/flavour-gen/releases/download/{{ .Tag }}/{{ .ArtifactName }}
    url: https://github.com/ZenDeveloper7/flavour-gen/releases/download/{{ .Tag }}/
